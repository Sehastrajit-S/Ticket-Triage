services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "15432:5432"
    volumes:
      - triage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  triage-pgdata:
