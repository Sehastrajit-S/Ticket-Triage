[project]
name = "ticket-triage"
version = "0.1.0"
description = "Production-grade support-ticket triage agent on the Cohere stack (Command A, Embed v4, Rerank 4)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "cohere>=5.13",
    "north-mcp-python-sdk @ git+https://github.com/cohere-ai/north-mcp-python-sdk.git",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "langfuse>=2.53",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...) as a default argument is the documented pattern
]
